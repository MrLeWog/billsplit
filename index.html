<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split the bill</title>
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e4e7ec;--acc:#0e7c66;--accI:#fff;--warn:#b54708;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#eef1f5;--mute:#98a2b3;--line:#2a3038;--acc:#2bb894;--accI:#04130e;--warn:#f79009;--bad:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:20px;margin:16px 0 8px}h3{font-size:16px;margin:10px 0 6px}
.sub,.hint,.mute,small{color:var(--mute)}.sub{margin:0 0 12px}.hint{font-size:14px;margin:6px 0}
.ok{color:var(--acc)}.warn{color:var(--warn)}.danger{color:var(--bad)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:600;display:inline-block;text-align:center;margin:4px 0}
.btn.primary{background:var(--acc);color:var(--accI);border-color:transparent}
.btn.big{width:100%;padding:16px;margin:8px 0}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.billcard{display:block;width:100%;text-align:left}.billcard span{display:block;color:var(--mute);font-size:14px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{resize:vertical;margin:6px 0}
pre{white-space:pre-wrap;font-size:12px;background:var(--card);padding:8px;border-radius:8px}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}.row .price{width:96px;flex:none;text-align:right}
.lbl{font-size:14px;color:var(--mute);flex:1}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chip.on{background:var(--acc);color:var(--accI);border-color:transparent}.chip.big{padding:14px 22px;font-size:18px}
.chipx{background:none;border:0;color:inherit;opacity:.7;padding:0 0 0 4px}
.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--mute)}.steps .on{color:var(--acc);font-weight:700}.steps .done{color:var(--ink)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0}
.progress{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;width:3%;background:var(--acc);transition:width .2s}
.pick{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}.pick.on{border-color:var(--acc)}
.pickbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;text-align:left}
.pickbtn .n{flex:1}.box{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:15px;color:var(--accI)}
.pick.on .box{background:var(--acc);border-color:var(--acc)}
.split{padding:0 14px 12px 50px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.split b{color:var(--ink);min-width:16px;text-align:center}.split em{font-style:normal;color:var(--acc);font-weight:700}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar>*{max-width:560px}.amt{font-size:28px;font-weight:800}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9}
details{margin:12px 0;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
